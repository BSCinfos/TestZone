<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BSCinfos</title>
  <script src="users.js"></script>
  <script src="auth.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="platform.css">
  <script src="platform.js" defer></script>
  <link rel="stylesheet" href="brand.css?v=20261102-login-split">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#0b0d12;font-family:'Segoe UI',Arial,sans-serif;color:#f8fafc}
    body{min-height:100vh;min-height:100dvh;overflow:hidden}
    .login-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh;min-height:100dvh}
    .login-video-panel{position:relative;min-width:0;overflow:hidden;background:#05070b}
    .login-video-panel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#05070b}
    .login-video-panel:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(0,118,254,.10),transparent 55%,rgba(0,0,0,.18))}
    .login-form-panel{display:flex;align-items:center;justify-content:center;padding:40px 28px;background:#0d0f14;border-left:1px solid #202633}
    .login-card{width:100%;max-width:420px;padding:42px 40px 36px;background:#16181f;border:1px solid #2a2d3a;border-radius:18px;box-shadow:0 12px 55px rgba(0,0,0,.38)}
    .login-logo{text-align:center;margin-bottom:30px}
    .login-logo img{display:block;width:76px;height:76px;object-fit:contain;margin:0 auto 14px}
    .login-logo-title{font-size:28px;font-weight:900;letter-spacing:.5px;color:#fff}
    .login-logo-title span{color:#0076FE}
    .login-logo-sub{font-size:13px;color:#8493a8;margin-top:7px}
    .login-form label{display:block;font-size:12px;font-weight:700;color:#a7b4c7;margin:0 0 7px;letter-spacing:.5px;text-transform:uppercase}
    .login-form input{width:100%;padding:12px 14px;background:#0f1117;border:1px solid #30394a;border-radius:9px;color:#f1f5f9;font-size:15px;margin-bottom:19px;outline:none;transition:border-color .2s,box-shadow .2s}
    .login-form input:focus{border-color:#0076FE;box-shadow:0 0 0 3px rgba(0,118,254,.14)}
    .login-btn{width:100%;padding:13px;background:#0076FE;color:#fff;font-size:15px;font-weight:800;border:0;border-radius:10px;cursor:pointer;letter-spacing:.5px;transition:background .2s,transform .1s}
    .login-btn:hover{background:#0065dc}.login-btn:active{transform:scale(.985)}
    .login-error{display:none;background:rgba(248,113,113,.12);border:1px solid #f87171;color:#f87171;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:16px;text-align:center}
    .login-error.visible{display:block}
    @media(max-width:760px){body{overflow:auto}.login-split{grid-template-columns:1fr;grid-template-rows:minmax(220px,38vh) 1fr}.login-video-panel{min-height:220px}.login-form-panel{padding:28px 18px 36px;border-left:0;border-top:1px solid #202633}.login-card{padding:32px 25px 28px}}
    @media(prefers-reduced-motion:reduce){.login-btn,.login-form input{transition:none}}
  </style>
</head>
<body>
  <main class="login-split">
    <section class="login-video-panel" aria-label="Vídeo de apresentação BSCinfos">
      <video autoplay muted loop playsinline preload="auto" poster="bscinfos-logo.png">
        <source src="logos_loop" type="video/mp4">
      </video>
    </section>
    <section class="login-form-panel">
      <div class="login-card">
        <div class="login-logo">
          <img src="bscinfos-logo.png" alt="Logo BSCinfos" onerror="this.style.display='none'">
          <div class="login-logo-title">BSC<span>infos</span></div>
          <div class="login-logo-sub">Acesso restrito — faça login para continuar</div>
        </div>
        <form class="login-form" id="loginForm" onsubmit="tentarLogin(event)">
          <div class="login-error" id="loginErro">Usuário ou senha incorretos.</div>
          <label for="inputUser">Usuário</label>
          <input type="text" id="inputUser" placeholder="Seu usuário" autocomplete="username" autofocus required>
          <label for="inputPass">Senha</label>
          <input type="password" id="inputPass" placeholder="Sua senha" autocomplete="current-password" required>
          <button type="submit" class="login-btn">ENTRAR</button>
        </form>
      </div>
    </section>
  </main>
  <script>
    if (window.BSC_USER && window.BSC_USER()) {
      var dest = sessionStorage.getItem('bsc_redirect') || 'index.html';
      sessionStorage.removeItem('bsc_redirect');
      window.location.replace(dest);
    }
    function tentarLogin(e) {
      e.preventDefault();
      var user=document.getElementById('inputUser').value;
      var pass=document.getElementById('inputPass').value;
      var erro=document.getElementById('loginErro');
      if(window.BSC_LOGIN(user,pass)){
        erro.classList.remove('visible');
        var dest=sessionStorage.getItem('bsc_redirect')||'index.html';
        sessionStorage.removeItem('bsc_redirect');
        window.location.replace(dest);
      }else{
        erro.classList.add('visible');
        document.getElementById('inputPass').value='';
        document.getElementById('inputPass').focus();
      }
    }
  </script>
</body>
</html>
