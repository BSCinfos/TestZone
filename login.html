<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — BSCinfos</title>
    <script src="users.js"></script>
    <script src="auth.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        * { box-sizing: border-box; }
        html, body { width:100%; min-height:100%; margin:0; }
        body {
            min-height:100vh; display:grid; grid-template-columns: 1fr 1fr;
            background:#0d0f14; color:#f8fafc; font-family:'Segoe UI',sans-serif;
            overflow-x:hidden;
        }
        /* Login na metade esquerda, sem card/retângulo */
        .login-side {
            min-width:0; min-height:100vh; display:flex; align-items:center;
            justify-content:center; padding:48px clamp(24px,7vw,110px);
            background:#0d0f14; position:relative; z-index:1;
        }
        .login-content { width:100%; max-width:390px; }
        .login-logo { text-align:center; margin-bottom:34px; }
        .login-logo-title { font-size:32px; font-weight:900; letter-spacing:.5px; color:#fff; }
        .login-logo-title span { color:#0076fe; }
        .login-logo-sub { font-size:13px; color:#94a3b8; margin-top:8px; }
        .login-form label { display:block; font-size:12px; font-weight:700; color:#cbd5e1; margin-bottom:7px; letter-spacing:.5px; text-transform:uppercase; }
        .login-form input {
            width:100%; padding:13px 15px; background:#e8f0ff; border:1px solid #cbd5e1;
            border-radius:9px; color:#111827; font-size:15px; margin-bottom:20px; outline:none;
        }
        .login-form input:focus { border-color:#0076fe; box-shadow:0 0 0 3px rgba(0,118,254,.18); }
        .login-btn {
            width:100%; padding:14px; background:#0076fe; color:#fff; font-size:15px;
            font-weight:800; border:0; border-radius:9px; cursor:pointer; letter-spacing:.5px;
            transition:background .2s, transform .1s;
        }
        .login-btn:hover { background:#0065dc; }
        .login-btn:active { transform:scale(.985); }
        .login-error { display:none; background:rgba(248,113,113,.12); border:1px solid #f87171; color:#f87171; border-radius:8px; padding:10px 14px; font-size:13px; font-weight:600; margin-bottom:16px; text-align:center; }
        .login-error.visible { display:block; }
        /* Vídeo real em loop na metade direita: não usar a logo como imagem */
        .video-side { min-width:0; min-height:100vh; position:relative; overflow:hidden; background:#05070b; }
        .video-side video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
        .trial-btn{width:100%;margin-top:12px;padding:12px;background:transparent;border:1px solid #0076fe;color:#69aaff;border-radius:9px;font-weight:800;cursor:pointer}
        .trial-btn:hover{background:rgba(0,118,254,.13)}
        .trial-btn:disabled{opacity:.45;cursor:not-allowed}
        .trial-note{min-height:18px;margin:10px 0 0;text-align:center;color:#94a3b8;font-size:12px}
        @media (max-width: 760px) {
            body { grid-template-columns:1fr; grid-template-rows:minmax(260px,38vh) auto; }
            .video-side { grid-row:1; min-height:260px; height:38vh; }
            .login-side { grid-row:2; min-height:62vh; padding:42px 26px; }
            .login-content { max-width:420px; }
        }
        @media (prefers-reduced-motion: reduce) { .login-btn { transition:none; } }
    .login-social-footer{left:18px;right:18px;position:fixed;bottom:8px}\n        @media(max-width:760px){.login-social-footer{left:8px;right:8px;bottom:6px}}\n    </style>

    <link rel="stylesheet" href="platform.css">
    <script src="platform.js" defer></script>
    <link rel="stylesheet" href="brand.css?v=20261101-blue">
    <link rel="icon" type="image/png" href="element/bscinfos-logo.png">
</head>
<body>
    <script src="brand.js?v=20261101-blue"></script>

<main class="login-side">
    <div class="login-content">
        <div class="login-logo">
            <div class="login-logo-title">BSC<span>infos</span></div>
            <div class="login-logo-sub">Acesso restrito — faça login para continuar</div>
        </div>
        <form class="login-form" id="loginForm" onsubmit="tentarLogin(event)">
            <div class="login-error" id="loginErro">Usuário ou senha incorretos.</div>
            <label for="inputUser">Usuário</label>
            <input type="text" id="inputUser" placeholder="Seu usuário" autocomplete="username" autofocus>
            <label for="inputPass">Senha</label>
            <input type="password" id="inputPass" placeholder="Sua senha" autocomplete="current-password">
            <button type="submit" class="login-btn">ENTRAR</button>
            <button type="button" class="trial-btn" id="startTrialBtn">TESTE GRÁTIS — 30 MINUTOS</button>
            <p class="trial-note" id="trialNote" aria-live="polite"></p>
        </form>
    </div>
</main>
<section class="video-side" aria-label="Vídeo de apresentação BSCinfos">
    <video autoplay muted loop playsinline preload="auto">
        <source src="logos_loop.mp4" type="video/mp4">
    </video>
</section>

<script>
    // Se já está logado, redireciona direto para o índice
    if (window.BSC_USER && window.BSC_USER()) {
        var dest = sessionStorage.getItem('bsc_redirect') || 'index.html';
        sessionStorage.removeItem('bsc_redirect');
        window.location.replace(dest);
    }

    (function setupTrialButton(){
        var btn=document.getElementById('startTrialBtn');
        var note=document.getElementById('trialNote');
        if(!btn) return;
        function refresh(){
            var available=window.BSC_TRIAL_AVAILABLE && window.BSC_TRIAL_AVAILABLE();
            btn.disabled=!available;
            if(!available) note.textContent='Este navegador já utilizou o período de teste.';
        }
        btn.addEventListener('click',function(){
            if(!window.BSC_START_TRIAL || !window.BSC_START_TRIAL()){
                note.textContent='Não foi possível iniciar o teste neste navegador.';
                refresh(); return;
            }
            var dest=sessionStorage.getItem('bsc_redirect')||'index.html';
            sessionStorage.removeItem('bsc_redirect');
            window.location.replace(dest);
        });
        refresh();
    })();

    function tentarLogin(e) {
        e.preventDefault();
        var user = document.getElementById('inputUser').value;
        var pass = document.getElementById('inputPass').value;
        var erro = document.getElementById('loginErro');

        if (window.BSC_LOGIN(user, pass)) {
            erro.classList.remove('visible');
            var dest = sessionStorage.getItem('bsc_redirect') || 'index.html';
            sessionStorage.removeItem('bsc_redirect');
            window.location.replace(dest);
        } else {
            erro.classList.add('visible');
            document.getElementById('inputPass').value = '';
            document.getElementById('inputPass').focus();
        }
    }
</script>

<footer class="bsc-social-footer login-social-footer"><a href="https://instagram.com/bs_libb" target="_blank" rel="noopener"><span>◎</span>@bs_libb</a><a href="https://x.com/bs_lib" target="_blank" rel="noopener"><span>𝕏</span>@bs_lib</a><a href="https://discord.com/" target="_blank" rel="noopener"><span>◉</span>@bs_lib</a></footer>
</body>
</html>
